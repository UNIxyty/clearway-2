server {
  listen 80;
  server_name _;

  client_max_body_size 25m;

  # Resolve container names through Docker's embedded DNS on EVERY request
  # (via the variable upstreams below). Without this, nginx resolves the
  # names once at startup and keeps proxying to stale IPs after
  # `docker compose up --build` recreates the frontend/backend containers —
  # which surfaces as 502s until the gateway is restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $dw_frontend digital-wall-frontend;
  set $dw_backend digital-wall-backend:5174;

  location = /digital-wall {
    return 301 /digital-wall/timeline/;
  }

  location = /digital-wall/ {
    return 301 /digital-wall/timeline/;
  }

  # Display Console (same SPA, client-rendered under /console/*)
  location = /digital-wall/console {
    return 301 /digital-wall/console/flights;
  }

  location /digital-wall/console/ {
    rewrite ^/digital-wall/console/.*$ / break;
    proxy_pass http://$dw_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Frontend entry routes (same SPA, different surface by URL tail)
  location = /digital-wall/timeline {
    rewrite ^.*$ / break;
    proxy_pass http://$dw_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # React timeline UI (opsboard) — assets and SPA fallback
  location /digital-wall/timeline/ {
    rewrite ^/digital-wall/timeline/(.*)$ /$1 break;
    proxy_pass http://$dw_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Legacy tab URLs still load the SPA (it client-redirects into /console/*).
  location ~ ^/digital-wall/(aircrafts|limitations|operators)$ {
    rewrite ^.*$ / break;
    proxy_pass http://$dw_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Server-Sent Events stream: no buffering, long read timeout.
  location = /digital-wall/api/stream {
    rewrite ^/digital-wall/(.*)$ /$1 break;
    proxy_pass http://$dw_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    chunked_transfer_encoding off;
  }

  # Everything else under /digital-wall goes to digital-wall backend.
  # Strip prefix so backend still sees /api/*, /operators, /backend-test, etc.
  location /digital-wall/ {
    rewrite ^/digital-wall/(.*)$ /$1 break;
    proxy_pass http://$dw_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
