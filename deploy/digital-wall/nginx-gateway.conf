server {
  listen 80;
  server_name _;

  client_max_body_size 25m;

  location = /digital-wall {
    return 301 /digital-wall/timeline/;
  }

  location = /digital-wall/ {
    return 301 /digital-wall/timeline/;
  }

  # Frontend entry routes (same SPA, different tab by URL tail)
  location = /digital-wall/timeline {
    proxy_pass http://digital-wall-frontend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /digital-wall/aircrafts {
    proxy_pass http://digital-wall-frontend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /digital-wall/limitations {
    proxy_pass http://digital-wall-frontend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /digital-wall/operators {
    proxy_pass http://digital-wall-frontend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # React timeline UI (opsboard)
  location /digital-wall/timeline/ {
    proxy_pass http://digital-wall-frontend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Everything else under /digital-wall goes to digital-wall backend.
  # Strip prefix so backend still sees /api/*, /operators, /aircrafts, /backend-test, etc.
  location /digital-wall/ {
    rewrite ^/digital-wall/(.*)$ /$1 break;
    proxy_pass http://digital-wall-backend:5174;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
