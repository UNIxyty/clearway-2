<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aircrafts · Digital Wall</title>
    <link rel="stylesheet" href="/admin-common.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div>
          <h1><span class="icon">✈️</span>Aircrafts</h1>
          <p class="subtitle">Aircraft with flights in the next 7 days across all operators. Disabled aircraft are hidden on timeline.</p>
        </div>
        <button id="refreshBtn" class="primary" type="button"><span class="icon">🔄</span>Refresh</button>
      </header>

      <section class="card">
        <div id="summary" class="status">Loading aircraft schedule...</div>
        <table class="table" style="margin-top:12px">
          <thead>
            <tr>
              <th>Visible</th>
              <th>Registration</th>
              <th>Operator</th>
              <th>Flights (7d)</th>
              <th>Next Flight</th>
            </tr>
          </thead>
          <tbody id="aircraftBody"></tbody>
        </table>
      </section>
    </main>

    <script src="/wall-menu.js"></script>
    <script>
      const aircraftBody = document.getElementById("aircraftBody");
      const summary = document.getElementById("summary");

      async function api(path, init) {
        const res = await fetch(path, init);
        const data = await res.json();
        if (!res.ok || data.ok === false) {
          throw new Error(data.error || `Request failed (${res.status})`);
        }
        return data;
      }

      function fmt(value) {
        if (!value) return "-";
        const dt = new Date(value);
        if (Number.isNaN(dt.getTime())) return String(value);
        return dt.toISOString().replace("T", " ").slice(0, 16) + "Z";
      }

      function renderRows(aircraft) {
        aircraftBody.innerHTML = "";
        for (const row of aircraft) {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>
              <input
                type="checkbox"
                class="toggle"
                data-opr-id="${row.oprId}"
                data-registration="${row.registration}"
                ${row.isHidden ? "" : "checked"}
              />
            </td>
            <td><strong>${row.registration}</strong></td>
            <td>${row.operatorName || row.oprId}</td>
            <td>${row.flightCount ?? 0}</td>
            <td>${fmt(row.nextFlightStart)}</td>
          `;
          aircraftBody.appendChild(tr);
        }
      }

      async function loadAircraft() {
        summary.className = "status loading";
        summary.textContent = "Loading aircraft schedule...";
        const data = await api("/api/aircraft/schedule?days=7&refresh=true");
        renderRows(data.aircraft || []);
        summary.className = "status";
        summary.textContent = `${data.totalAircraft || 0} aircraft with flights in next ${data.days || 7} days (${data.source || "unknown"}).`;
      }

      aircraftBody.addEventListener("change", async (event) => {
        const input = event.target.closest(".toggle");
        if (!input) return;
        const oprId = input.getAttribute("data-opr-id");
        const registration = input.getAttribute("data-registration");
        const isHidden = !input.checked;
        try {
          summary.className = "status loading";
          summary.textContent = `Saving visibility for ${registration}...`;
          await api("/api/aircraft/visibility", {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ oprId, registration, isHidden }),
          });
          summary.className = "status";
          summary.textContent = `${registration} is now ${isHidden ? "hidden" : "visible"} on timeline.`;
        } catch (error) {
          summary.className = "status error";
          summary.textContent = error.message;
          input.checked = !isHidden;
        }
      });

      document.getElementById("refreshBtn").addEventListener("click", loadAircraft);
      loadAircraft().catch((error) => {
        summary.className = "status error";
        summary.textContent = error.message;
      });
    </script>
  </body>
</html>
