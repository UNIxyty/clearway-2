<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operators · Digital Wall</title>
    <link rel="stylesheet" href="/admin-common.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div>
          <h1><span class="icon">🧩</span>Operators</h1>
          <p class="subtitle">Add Leon operators with prefix and refresh token. Tokens are stored securely and never shown again.</p>
        </div>
        <div id="storageMode" class="chip">storage: -</div>
      </header>

      <section class="card">
        <h2 style="margin-top:0">Add / Update Operator</h2>
        <form id="operatorForm" class="grid grid-3">
          <label>
            Name
            <input id="name" name="name" placeholder="Clearway Demo" required />
          </label>
          <label>
            Leon Prefix
            <input id="oprId" name="oprId" placeholder="cwy-cwy" required />
          </label>
          <label>
            Leon API Refresh Token
            <input id="refreshToken" name="refreshToken" placeholder="paste refresh token" required />
          </label>
          <div style="grid-column: 1 / -1; display:flex; gap:10px;">
            <button class="primary" type="submit"><span class="icon">💾</span>Save Operator</button>
            <button id="reloadBtn" type="button"><span class="icon">🔄</span>Reload List</button>
          </div>
        </form>
        <div id="formStatus" class="status"></div>
      </section>

      <section class="card">
        <h2 style="margin-top:0">Configured Operators</h2>
        <table class="table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Leon Prefix</th>
              <th>Token</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="operatorsBody"></tbody>
        </table>
      </section>
    </main>

    <script src="/wall-menu.js"></script>
    <script>
      const form = document.getElementById("operatorForm");
      const formStatus = document.getElementById("formStatus");
      const operatorsBody = document.getElementById("operatorsBody");
      const storageMode = document.getElementById("storageMode");

      async function api(path, init) {
        const res = await fetch(path, init);
        const data = await res.json();
        if (!res.ok || data.ok === false) {
          throw new Error(data.error || `Request failed (${res.status})`);
        }
        return data;
      }

      function renderOperators(payload) {
        storageMode.textContent = `storage: ${payload.storage || "unknown"}`;
        operatorsBody.innerHTML = "";
        for (const operator of payload.operators || []) {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${operator.name || "-"}</td>
            <td><code>${operator.oprId}</code></td>
            <td>${operator.hasRefreshToken ? '<span class="chip ok">configured</span>' : '<span class="chip warn">missing</span>'}</td>
            <td>${operator.isActive ? '<span class="chip ok">active</span>' : '<span class="chip warn">inactive</span>'}</td>
            <td>
              <button data-id="${operator.id}" data-active="${operator.isActive ? "0" : "1"}" class="toggle-active">
                ${operator.isActive ? "Disable" : "Enable"}
              </button>
            </td>
          `;
          operatorsBody.appendChild(tr);
        }
      }

      async function loadOperators() {
        formStatus.className = "status loading";
        formStatus.textContent = "Loading operators...";
        const data = await api("/api/operators?includeInactive=true");
        renderOperators(data);
        formStatus.className = "status";
        formStatus.textContent = `Loaded ${data.operators.length} operator(s).`;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        formStatus.className = "status loading";
        formStatus.textContent = "Saving operator...";
        try {
          await api("/api/operators", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              name: document.getElementById("name").value.trim(),
              oprId: document.getElementById("oprId").value.trim(),
              refreshToken: document.getElementById("refreshToken").value.trim(),
            }),
          });
          document.getElementById("refreshToken").value = "";
          formStatus.className = "status";
          formStatus.textContent = "Operator saved.";
          await loadOperators();
        } catch (error) {
          formStatus.className = "status error";
          formStatus.textContent = error.message;
        }
      });

      operatorsBody.addEventListener("click", async (event) => {
        const button = event.target.closest(".toggle-active");
        if (!button) return;
        const id = button.getAttribute("data-id");
        const isActive = button.getAttribute("data-active") === "1";
        try {
          await api(`/api/operators/${id}`, {
            method: "PATCH",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ isActive }),
          });
          await loadOperators();
        } catch (error) {
          formStatus.className = "status error";
          formStatus.textContent = error.message;
        }
      });

      document.getElementById("reloadBtn").addEventListener("click", loadOperators);
      loadOperators().catch((error) => {
        formStatus.className = "status error";
        formStatus.textContent = error.message;
      });
    </script>
  </body>
</html>
