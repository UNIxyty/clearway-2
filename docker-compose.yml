services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        ALLOW_NON_MAIN_BUILD: ${ALLOW_NON_MAIN_BUILD:-0}
    image: clearway-selfhosted:latest
    command: node server.js
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      STORAGE_ROOT: /storage
      CACHE_ROOT: /cache
      NODE_ENV: production
      NOTAM_SYNC_URL: http://notam-sync:3001
      WEATHER_SYNC_URL: http://weather-sync:3001
      AIP_SYNC_URL: http://aip-sync:3002
      LITHUANIA_SELENIUM_URL: http://lithuania-browser:4444/wd/hub
      # NOTAMs must come from CrewBriefing only (matches the sync workers;
      # without this the portal's cache-miss local spawn defaults to skylink).
      # Requires CREWBRIEFING_USERNAME / CREWBRIEFING_PASSWORD in .env
      # (USERNAME, not USER — the AWS setup doc is wrong).
      NOTAM_SCRAPER: crewbriefing
    volumes:
      - /mnt/ssd-cache:/cache
      - /mnt/hdd-storage:/storage
    depends_on:
      - lithuania-browser

  lithuania-browser:
    image: selenium/standalone-chromium:latest
    shm_size: "2gb"
    ports:
      # noVNC viewer of the scraping browser: localhost only (portal foundations 1.5 — it listened on every interface,
      # with the image's default VNC password and no host firewall). Reach it with: ssh -L 6080:127.0.0.1:6080 root@clearway-2
      - "127.0.0.1:6080:7900"
    environment:
      SE_NODE_MAX_SESSIONS: 1
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_NODE_SESSION_TIMEOUT: 900

  notam-sync:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-runner
      args:
        ALLOW_NON_MAIN_BUILD: ${ALLOW_NON_MAIN_BUILD:-0}
    image: clearway-selfhosted-worker:latest
    command: node scripts/notam-sync-server.mjs
    env_file:
      - .env
    environment:
      STORAGE_ROOT: /storage
      CACHE_ROOT: /cache
      NODE_ENV: production
      NOTAM_SCRAPER: crewbriefing
      SYNC_SECRET: ${NOTAM_SYNC_SECRET}
    volumes:
      - /mnt/ssd-cache:/cache
      - /mnt/hdd-storage:/storage

  weather-sync:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-runner
      args:
        ALLOW_NON_MAIN_BUILD: ${ALLOW_NON_MAIN_BUILD:-0}
    image: clearway-selfhosted-worker:latest
    command: sh -c "SYNC_SERVER_MODE=weather node scripts/notam-sync-server.mjs"
    env_file:
      - .env
    environment:
      STORAGE_ROOT: /storage
      CACHE_ROOT: /cache
      NODE_ENV: production
      NOTAM_SCRAPER: crewbriefing
      SYNC_SECRET: ${WEATHER_SYNC_SECRET}
    volumes:
      - /mnt/ssd-cache:/cache
      - /mnt/hdd-storage:/storage

  aip-sync:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-runner
      args:
        ALLOW_NON_MAIN_BUILD: ${ALLOW_NON_MAIN_BUILD:-0}
    image: clearway-selfhosted-worker:latest
    command: node scripts/aip-sync-server.mjs
    env_file:
      - .env
    environment:
      STORAGE_ROOT: /storage
      CACHE_ROOT: /cache
      NODE_ENV: production
      SYNC_SECRET: ${NOTAM_SYNC_SECRET}
    volumes:
      - /mnt/ssd-cache:/cache
      - /mnt/hdd-storage:/storage

  digital-wall-backend:
    build:
      context: ./digital-wall
      dockerfile: Dockerfile
      # The branch guard needs .git/HEAD and its script from the repo root.
      additional_contexts:
        repo: .
      args:
        ALLOW_NON_MAIN_BUILD: ${ALLOW_NON_MAIN_BUILD:-0}
    container_name: digital-wall-backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 5174
      NODE_ENV: production
      # Voice readout relay (item 6): the shared secret agent-service sends on
      # POST /internal/voice-activity. Value lives ONLY in the server's .env
      # (same value for both services); unset = readout disabled, no errors.
      AGENT_WALL_EVENTS_SECRET: ${AGENT_WALL_EVENTS_SECRET:-}
    command: node server.mjs
    expose:
      - "5174"
    volumes:
      - ./data:/app/shared-data:ro
      # Persist the wall's local-JSON stores (clocks, Important entries,
      # alert rules/findings, NOTAM-check state) across container rebuilds.
      - ./digital-wall/data:/app/data

  digital-wall-frontend:
    build:
      # Root context so the image can COPY shared/ (the single token
      # source) alongside the app — matches the portal/worker pattern.
      context: .
      dockerfile: opsboard-react/Dockerfile
      args:
        ALLOW_NON_MAIN_BUILD: ${ALLOW_NON_MAIN_BUILD:-0}
        VITE_BASE_PATH: /digital-wall/timeline/
        VITE_API_BASE_URL: /digital-wall
    container_name: digital-wall-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - digital-wall-backend

  digital-wall-gateway:
    image: nginx:1.27-alpine
    container_name: digital-wall-gateway
    restart: unless-stopped
    depends_on:
      - digital-wall-frontend
      - digital-wall-backend
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./deploy/digital-wall/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro

  agent-service:
    build:
      # Root context so the image can COPY digital-wall/lib/mailer.mjs — the
      # platform's ONE Resend send path — alongside the agent. Same arrangement
      # as digital-wall-frontend, which uses a root context to share shared/.
      context: .
      dockerfile: agent/Dockerfile
      args:
        ALLOW_NON_MAIN_BUILD: ${ALLOW_NON_MAIN_BUILD:-0}
    container_name: agent-service
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 5175
      NODE_ENV: production
      # Part 1 pins every tier to one model; see agent/config/models.json.
      # AGENT_ACTIVE_TIER=none hands routing back to the caller (Part 10).
      BEDROCK_REGION: ${BEDROCK_REGION:-eu-north-1}
      # Voice readout relay to the wall (item 6) — see digital-wall-backend.
      # Relayed to DIGITAL_WALL_INTERNAL_URL (default http://digital-wall-backend:5174).
      AGENT_WALL_EVENTS_SECRET: ${AGENT_WALL_EVENTS_SECRET:-}
      # Flight intake: raw mail and attachments (personal data) on the large disk, owner-only, under retention.
      INTAKE_ROOT: /intake
    expose:
      - "5175"
    ports:
      # Published on loopback only; cloudflared routes /agent/* here, matching
      # how the wall gateway is reached on 8088.
      - "127.0.0.1:8089:5175"
    volumes:
      # Generated files AND uploaded knowledge originals. This was the one
      # service without a volume, so every rebuild deleted both while the
      # database rows kept pointing at them (audit 2026-09, S3). On the SSD
      # cache like the other services, never the container's root filesystem.
      - /mnt/ssd-cache/agent:/storage
      # Intake mailbox storage (agent/lib/intake/blobstore.mjs): raw/YYYY/MM/DD/<uuid>.eml and files/ab/cd/<sha256>.
      # Not backed up off-site (none of /mnt/hdd-storage is today); retention deletes after the configured period.
      - /mnt/hdd-storage/intake:/intake

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: n8n.verxyl.com
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.verxyl.com/
      GENERIC_TIMEZONE: UTC
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
