services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: clearway-selfhosted:latest
    command: node server.js
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      STORAGE_ROOT: /storage
      CACHE_ROOT: /cache
      NODE_ENV: production
      NOTAM_SYNC_URL: http://notam-sync:3001
      WEATHER_SYNC_URL: http://weather-sync:3001
      AIP_SYNC_URL: http://aip-sync:3002
      LITHUANIA_SELENIUM_URL: http://lithuania-browser:4444/wd/hub
    volumes:
      - /mnt/ssd-cache:/cache
      - /mnt/hdd-storage:/storage
    depends_on:
      - lithuania-browser

  pickem:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: clearway-pickem:latest
    command: node server.js
    env_file:
      - .env
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      STORAGE_ROOT: /storage
      CACHE_ROOT: /cache
      NODE_ENV: production
      NOTAM_SYNC_URL: http://notam-sync:3001
      WEATHER_SYNC_URL: http://weather-sync:3001
      AIP_SYNC_URL: http://aip-sync:3002
      LITHUANIA_SELENIUM_URL: http://lithuania-browser:4444/wd/hub
    volumes:
      - /mnt/ssd-cache:/cache
      - /mnt/hdd-storage:/storage
    depends_on:
      - lithuania-browser
    healthcheck:
      test: ["CMD", "node", "-e", "const p=process.env.PORT||3000;fetch(`http://127.0.0.1:${p}/pickem/api/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  lithuania-browser:
    image: selenium/standalone-chromium:latest
    shm_size: "2gb"
    ports:
      - "6080:7900"
    environment:
      SE_NODE_MAX_SESSIONS: 1
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_NODE_SESSION_TIMEOUT: 900

  notam-sync:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-runner
    image: clearway-selfhosted-worker:latest
    command: node scripts/notam-sync-server.mjs
    env_file:
      - .env
    environment:
      STORAGE_ROOT: /storage
      CACHE_ROOT: /cache
      NODE_ENV: production
      NOTAM_SCRAPER: crewbriefing
      SYNC_SECRET: ${NOTAM_SYNC_SECRET}
    volumes:
      - /mnt/ssd-cache:/cache
      - /mnt/hdd-storage:/storage

  weather-sync:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-runner
    image: clearway-selfhosted-worker:latest
    command: sh -c "SYNC_SERVER_MODE=weather node scripts/notam-sync-server.mjs"
    env_file:
      - .env
    environment:
      STORAGE_ROOT: /storage
      CACHE_ROOT: /cache
      NODE_ENV: production
      NOTAM_SCRAPER: crewbriefing
      SYNC_SECRET: ${WEATHER_SYNC_SECRET}
    volumes:
      - /mnt/ssd-cache:/cache
      - /mnt/hdd-storage:/storage

  aip-sync:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-runner
    image: clearway-selfhosted-worker:latest
    command: node scripts/aip-sync-server.mjs
    env_file:
      - .env
    environment:
      STORAGE_ROOT: /storage
      CACHE_ROOT: /cache
      NODE_ENV: production
      SYNC_SECRET: ${NOTAM_SYNC_SECRET}
    volumes:
      - /mnt/ssd-cache:/cache
      - /mnt/hdd-storage:/storage

  digital-wall-backend:
    build:
      context: ./digital-wall
      dockerfile: Dockerfile
    container_name: digital-wall-backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 5174
      NODE_ENV: production
    command: node server.mjs
    expose:
      - "5174"

  digital-wall-frontend:
    build:
      context: ./opsboard-react
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /digital-wall/timeline/
        VITE_API_BASE_URL: /digital-wall
    container_name: digital-wall-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - digital-wall-backend

  digital-wall-gateway:
    image: nginx:1.27-alpine
    container_name: digital-wall-gateway
    restart: unless-stopped
    depends_on:
      - digital-wall-frontend
      - digital-wall-backend
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./deploy/digital-wall/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: n8n.verxyl.com
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.verxyl.com/
      GENERIC_TIMEZONE: UTC
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
