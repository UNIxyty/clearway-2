<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Same favicon as the portal (app/layout.tsx icons: /PFP.png) — the
         wall shares the origin, so this references the identical asset. -->
    <link rel="icon" type="image/png" href="/PFP.png" />
    <link rel="shortcut icon" href="/PFP.png" />
    <link rel="apple-touch-icon" href="/PFP.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clearway Display Console</title>
    <!-- Fonts are self-hosted (src/fonts.css, public/fonts): no Google Fonts, no CDN. Preloaded: only the wall's
         default text font in the four weights the wall uses; every other option loads when chosen. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/Nunito-dotted-400.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/Nunito-dotted-600.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/Nunito-dotted-700.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/Nunito-dotted-800.woff2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
