<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Same favicon as the portal (app/layout.tsx icons: /PFP.png) — the
         wall shares the origin, so this references the identical asset. -->
    <link rel="icon" type="image/png" href="/PFP.png" />
    <link rel="shortcut icon" href="/PFP.png" />
    <link rel="apple-touch-icon" href="/PFP.png" />
    <!-- The zoom bug (bug report 8 part 1B, 2026-11-10): the page never zooms by itself. No user-scalable=no (that breaks
         accessibility); instead every text field is 16px or more (iOS zooms on focus below that), buttons use
         touch-action: manipulation (no double-tap zoom), text-size-adjust is 100%, and nothing in code sets a scale.
         viewport-fit=cover lets the phone pages pad the safe areas themselves. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Clearway Display Console</title>
    <!-- The console follows the portal's theme (src/theme/portalTheme.js, the portal's components/portal/theme-script.ts):
         read the choice before the first paint so a dark console never flashes light. Console paths only — the wall
         display (/timeline) sets no data-theme and reads no portal token.
         The phone app (a /phone path) marks the page with its own class and theme only (cw3-doc, data-cw3-theme:
         src/phone/tokens.css), so its first paint has the right background; it sets no data-theme either. -->
    <script>(function(){try{if(/\/phone(\/|$)/.test(location.pathname)){var pc=localStorage.getItem("cw-theme"),pt=pc==="light"||pc==="dark"?pc:(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),pd=document.documentElement;pd.classList.add("cw3-doc");pd.setAttribute("data-cw3-theme",pt);return}if(!/\/console(\/|$)/.test(location.pathname)&&!/[?&]in=client(&|$)/.test(location.search))return;var c=localStorage.getItem("cw-theme"),t=c==="light"||c==="dark"?c:(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),d=document.documentElement;d.setAttribute("data-theme",t);d.style.colorScheme=t;if(localStorage.getItem("cw-motion")==="reduce")d.setAttribute("data-motion","reduce")}catch(e){}})();</script>
    <!-- Fonts are self-hosted (src/fonts.css, public/fonts): no Google Fonts, no CDN. Preloaded: only the wall's
         default text font in the four weights the wall uses; every other option loads when chosen. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/Nunito-dotted-400.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/Nunito-dotted-600.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/Nunito-dotted-700.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/Nunito-dotted-800.woff2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
