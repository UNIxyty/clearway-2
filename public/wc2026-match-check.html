        color: #334155;
      }
      .checks strong {

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        overflow: hidden;
      }
      th, td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid #e2e8f0;
        font-size: 13px;
      }
      th {
        background: #f8fafc;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #334155;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .group-pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        background: #e2e8f0;
        font-weight: 700;
      }
    </style>

    <script>
      function loadData() {
        const status = document.getElementById("status");
        const rows = document.getElementById("rows");
        const meta = document.getElementById("meta");
        const countTotal = document.getElementById("countTotal");
        const countCorrect = document.getElementById("countCorrect");
        const countError = document.getElementById("countError");
        status.textContent = "Loading...";
        rows.innerHTML = "";

        try {
          const jsonText = document.getElementById("fixtures-json").textContent || "{}";
          const json = JSON.parse(jsonText);

          const teamNames = {
            MEX: "Mexico", RSA: "South Africa", KOR: "Korea Republic", CZE: "Czechia",
            CAN: "Canada", BIH: "Bosnia and Herzegovina", QAT: "Qatar", SUI: "Switzerland",
            BRA: "Brazil", MAR: "Morocco", HAI: "Haiti", SCO: "Scotland",
            USA: "United States", PAR: "Paraguay", AUS: "Australia", TUR: "Türkiye",
            GER: "Germany", CUW: "Curaçao", CIV: "Côte d'Ivoire", ECU: "Ecuador",
            NED: "Netherlands", JPN: "Japan", SWE: "Sweden", TUN: "Tunisia",
            BEL: "Belgium", EGY: "Egypt", IRN: "IR Iran", NZL: "New Zealand",
            ESP: "Spain", CPV: "Cabo Verde", KSA: "Saudi Arabia", URU: "Uruguay",
            FRA: "France", SEN: "Senegal", IRQ: "Iraq", NOR: "Norway",
            ARG: "Argentina", ALG: "Algeria", AUT: "Austria", JOR: "Jordan",
            POR: "Portugal", COD: "DR Congo", UZB: "Uzbekistan", COL: "Colombia",
            ENG: "England", CRO: "Croatia", GHA: "Ghana", PAN: "Panama"
          };

          const matches = (json.matches || []).slice().sort(
            (a, b) => new Date(a.kickoffUtc).getTime() - new Date(b.kickoffUtc).getTime()
          );

          meta.textContent =
            `Competition: ${json.competition || "N/A"} | Group-stage matches: ${matches.length}`;
          countTotal.textContent = String(matches.length);
          countCorrect.textContent = "0";
          countError.textContent = "0";

          matches.forEach((m, idx) => {
            const home = teamNames[m.home] || m.home;
            const away = teamNames[m.away] || m.away;
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${idx + 1}</td>
              <td class="mono">${m.matchId || "-"}</td>
              <td><span class="group-pill">${m.group || "-"}</span></td>
              <td>${home}</td>
              <td>${away}</td>
              <td class="mono">${new Date(m.kickoffUtc).toISOString()}</td>
              <td class="mono">${new Date(m.kickoffUtc).toLocaleString("en-GB", { timeZone: "Europe/Riga" })}</td>
              <td>scheduled</td>
              <td><input type="checkbox" data-kind="correct" /></td>
              <td><input type="checkbox" data-kind="error" /></td>
            `;
            const correctBox = tr.querySelector('input[data-kind="correct"]');
            const errorBox = tr.querySelector('input[data-kind="error"]');
            function updateCounts() {
              countCorrect.textContent = String(
                rows.querySelectorAll('input[data-kind="correct"]:checked').length
              );
              countError.textContent = String(
                rows.querySelectorAll('input[data-kind="error"]:checked').length
              );
            }
            correctBox.addEventListener("change", () => {
              if (correctBox.checked) errorBox.checked = false;
              updateCounts();
            });
            errorBox.addEventListener("change", () => {
              if (errorBox.checked) correctBox.checked = false;
              updateCounts();
            });
            rows.appendChild(tr);
          });

          status.textContent = "Loaded successfully.";
        } catch (err) {
          meta.textContent = "Could not load fixtures.";
          status.textContent = err instanceof Error ? err.message : String(err);
        }
      }

      document.getElementById("reloadBtn").addEventListener("click", loadData);
      loadData();
    </script>
